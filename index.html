<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅途中的收获</title>
  <meta name="description" content="这次又会遇见谁？ · 一个人的游逸旅闻">
  <meta property="og:type" content="website">
  <meta property="og:title" content="小虫友记">
  <meta property="og:description" content="这次又会遇见谁？ · 一个人的游逸旅闻">
  <meta property="og:image" content="assets/img/album/luoye-01.jpg">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- 虚化背景：跟随当前浏览的图片变化 -->
  <div class="backdrop" aria-hidden="true">
    <img class="backdrop__img" id="backdropA" alt="">
    <img class="backdrop__img" id="backdropB" alt="">
    <div class="backdrop__veil"></div>
  </div>

  <!-- 摊开的书：左页条目卡片，右页图片 -->
  <div class="book">

    <!-- 左页：条目卡片网格 -->
    <section class="page page--left">
      <!-- 底部氛围：几片淡彩纸屑 + 一角暖光，条目不多时撑住下方留白 -->
      <span class="page__deco" aria-hidden="true">
        <i class="scrap"></i>
        <i class="scrap"></i>
        <i class="scrap"></i>
        <i class="sun"></i>
      </span>

      <!-- 整页滚动容器：品牌区 + 网格一起滑动，页脚钉在页底 -->
      <div class="page__scroll" id="pageScroll">
        <header class="brand">
          <h1 class="brand__title">这次又会遇见谁？</h1>
          <p class="brand__sub">提瓦特漫游记录</p>
          <p class="brand__stat">
            <span class="brand__mark"></span>已收录 <b id="statCount">0</b> 则记录
          </p>
          <button type="button" class="friend friend--me" id="meBtn" title="小虫">
          <img class="friend__avatar" src="assets/img/avatars/xiaochong.png" alt="小虫">
          <img class="friend__bug" src="assets/img/bug-apple.png" alt="" aria-hidden="true">
        </button>
        </header>

        <nav class="grid" id="grid" aria-label="记录列表"></nav>

        <i class="page__fill" id="pageFill" aria-hidden="true"></i>
      </div>

      <footer class="page__foot">我是小虫，这是我的朋友们^_^</footer>
    </section>

    <!-- 右页：图片为主 -->
    <section class="page page--right" id="stage" aria-live="polite"></section>

    <!-- PC 端收起照片墙：回到单页形象照 -->
    <button class="closebtn" id="closeBtn" type="button" aria-label="收起照片墙">✕</button>
  </div>

  <!-- 窄屏返回记录列表 -->
  <button class="backbtn" id="backBtn" type="button">返回</button>

  <!-- 图片放大层：点击图片以外的任意位置即可关闭 -->
  <div class="lightbox" id="lightbox" hidden>
    <figure class="lightbox__figure">
      <div class="lightbox__media" id="lbMedia"></div>
      <figcaption class="lightbox__cap" id="lbCap"></figcaption>
    </figure>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
