[permissions]
allow = ["Bash=cd \"D:/project/flamer\" && mkdir -p assets/css assets/js assets/img/records && \\\ncolors=(\"#74c2a8 #2f6b5c\" \"#e8b75c #9a762a\" \"#a98cd0 #5b4180\" \"#a5c83b #5f7a1e\" \"#5cb8e6 #2b6a9c\" \"#ef8a5a #9c4520\" \"#9fd6e3 #4e8ea6\" \"#8a7fa8 #453b5c\") && \\\ni=0 && for c in \"${colors[@]}\"; do\n  i=$((i+1))\n  set -- $c\n  n=$(printf \"%02d\" $i)\n  cat > \"assets/img/ph-$n.svg\" <<EOF\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 450\" width=\"800\" height=\"450\" role=\"img\" aria-label=\"placeholder $n\">\n  <defs>\n    <linearGradient id=\"g$n\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n      <stop offset=\"0\" stop-color=\"$1\"/>\n      <stop offset=\"1\" stop-color=\"$2\"/>\n    </linearGradient>\n  </defs>\n  <rect width=\"800\" height=\"450\" fill=\"url(#g$n)\"/>\n  <g fill=\"none\" stroke=\"#fffff0\" stroke-opacity=\"0.22\" stroke-width=\"2\">\n    <circle cx=\"400\" cy=\"225\" r=\"130\"/>\n    <path d=\"M400 95 L530 225 L400 355 L270 225 Z\"/>\n    <path d=\"M400 145 L480 225 L400 305 L320 225 Z\"/>\n  </g>\n  <text x=\"400\" y=\"240\" text-anchor=\"middle\" font-family=\"Georgia, serif\" font-size=\"44\" fill=\"#fffff0\" fill-opacity=\"0.9\">$n</text>\n</svg>\nEOF\ndone && \\\ncat > \"assets/img/favicon.svg\" <<'EOF'\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\">\n  <rect width=\"64\" height=\"64\" rx=\"14\" fill=\"#5c4d42\"/>\n  <path d=\"M32 12 L52 32 L32 52 L12 32 Z\" fill=\"none\" stroke=\"#d4af37\" stroke-width=\"3\"/>\n  <text x=\"32\" y=\"41\" text-anchor=\"middle\" font-family=\"Georgia, serif\" font-size=\"24\" fill=\"#d4af37\">Q</text>\n</svg>\nEOF\necho \"--- img ---\" && ls -1 assets/img/"]
